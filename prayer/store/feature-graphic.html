<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 구글 플레이 대표 그래픽(1024×500) 원본. 이 페이지를 1024×500으로 캡처해 feature-graphic.png를 만든다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
  @font-face { font-family: Yellowtail; src: url(../tools/fonts/Yellowtail-Regular.ttf); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #000; }
  .wrap { position: relative; width: 1024px; height: 500px;
    background: radial-gradient(420px 420px at 290px 250px, rgba(236, 72, 140, .38), rgba(0,0,0,0) 70%),
                radial-gradient(500px 300px at 760px 250px, rgba(255, 186, 110, .10), rgba(0,0,0,0) 70%); }
  .heart { position: absolute; left: 60px; top: 20px; width: 460px; height: 460px; mix-blend-mode: screen; } /* 아이콘의 검정 바탕이 네모로 보이지 않도록 */
  .text { position: absolute; left: 550px; top: 140px; color: #f6f1ea; }
  .ko { font-family: Jua, sans-serif; font-size: 96px; line-height: 1; letter-spacing: 2px; }
  .en { font-family: Yellowtail, cursive; font-size: 44px; color: #ffd3e6; margin: 6px 0 0 6px; }
  .sub { font-family: "Gowun Dodum", sans-serif; font-size: 28px; color: #ffc978; margin-top: 34px; letter-spacing: 1px; }
  .sub2 { font-family: "Gowun Dodum", sans-serif; font-size: 19px; color: #9a9089; margin-top: 10px; }
</style></head>
<body><div class="wrap">
  <img class="heart" src="../icons/icon-1024.png" alt="">
  <div class="text">
    <div class="ko">만트라</div>
    <div class="sub">염주 · 목탁 · 싱잉볼</div>
    <div class="sub2">휴대폰 하나로, 조용한 기도와 명상</div>
  </div>
</div></body></html>
